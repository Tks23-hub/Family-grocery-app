<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>📜 سجل القوائم السابقة</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>📜 سجل قوائم المشتريات</h1>

      <div id="historyList">
        <p>جاري تحميل السجل...</p>
      </div>
    </div>

    <script>
      async function loadHistory() {
        const res = await fetch("/history");
        const data = await res.json();

        const container = document.getElementById("historyList");

        if (!data || data.length === 0) {
          container.innerHTML = "<p>لا توجد بيانات بعد.</p>";
          return;
        }

        let html = "";
        data.forEach((entry) => {
          html += `
          <div style="border:1px solid #ccc; padding:10px; margin-bottom:15px; border-radius:8px;">
            <p><strong>📤 المُرسل:</strong> ${entry.sender}</p>
            <p><strong>🕒 وقت الإرسال:</strong> ${new Date(
              entry.sent_time
            ).toLocaleString()}</p>
            <p><strong>📄 القائمة:</strong></p>
            <ul>
              ${entry.items
                .split(",")
                .map((item) => `<li>${item.trim()}</li>`)
                .join("")}
            </ul>
            ${
              entry.received_by
                ? `<p><strong>📥 تم الاستلام من:</strong> ${
                    entry.received_by
                  } في ${new Date(entry.received_time).toLocaleString()}</p>`
                : ""
            }
            ${
              entry.done_by
                ? `<p><strong>✅ تم الانتهاء من قبل:</strong> ${
                    entry.done_by
                  } في ${new Date(entry.done_time).toLocaleString()}</p>`
                : ""
            }
          </div>
        `;
        });

        container.innerHTML = html;
      }

      loadHistory();
    </script>
  </body>
</html>
