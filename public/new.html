<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>إرسال قائمة مشتريات</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>📝 إرسال قائمة مشتريات</h1>

      <form id="groceryForm">
        <label for="name">الاسم:</label>
        <select id="name" required>
          <option value="" disabled selected>اختر اسمك</option>
          <option value="Samar">سمر</option>
          <option value="Hosen">حسين</option>
          <option value="Mohamed">محمد</option>
          <option value="Abed">عبد</option>
          <option value="Amro">عمرو</option>
        </select>

        <label for="password">كلمة المرور:</label>
        <input type="password" id="password" required />

        <label for="items">أدخل قائمة المشتريات:</label>
        <textarea
          id="items"
          rows="6"
          placeholder="مثال: طماطم، خبز، حليب..."
          required
        ></textarea>

        <button type="submit">إرسال القائمة</button>
      </form>

      <p id="message" style="margin-top: 15px"></p>
    </div>

    <script>
      document
        .getElementById("groceryForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          const name = document.getElementById("name").value;
          const password = document.getElementById("password").value;
          const items = document.getElementById("items").value.trim();

          const res = await fetch("/submit", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name, password, items }),
          });

          const messageEl = document.getElementById("message");

          if (res.ok) {
            messageEl.style.color = "green";
            messageEl.textContent = "✅ تم إرسال القائمة بنجاح";
            document.getElementById("groceryForm").reset();
          } else {
            const err = await res.json();
            messageEl.style.color = "red";
            messageEl.textContent = "❌ " + (err.error || "حدث خطأ في الإرسال");
          }
        });
    </script>
  </body>
</html>
